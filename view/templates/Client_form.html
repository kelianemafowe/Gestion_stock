<!doctype html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ajouter un client</title>

	<!-- Connecter le fichier CSS Flask -->
	<link rel="stylesheet" href="{{ url_for('static', filename='css/client_form.css') }}">

</head>



<body>
	<main class="form-container">
		<h1>Formulaire d'enrégistrement des client</h1>

		{% if message %}
			<p class="message {{ message_type }}">{{ message }}</p>
		{% endif %}

		<form method="POST" action="{{ url_for('client.ajouter_client') }}">
			<label for="nom">Nom</label>
			<input id="nom" name="nom" type="text" required>

			

			<label for="email">Email</label>
			<input id="email" name="email" type="email" required>

			<label for="ville">Ville</label>
			<input id="ville" name="ville" type="text" required>

			<label for="date_inscription">Date d'inscription</label>
			<input id="date_inscription" name="date_inscription" type="date" required>

			<button type="submit">Enregistrer le client</button>
		</form>
	</main>
</body>
</html>
