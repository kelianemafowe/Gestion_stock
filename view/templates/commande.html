<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/commande_form.css') }}">
    <title>Commande</title>
</head>
<body>
    <main>
        <div class="content">
            <h1>Formulaire d'enregistrement d'une commande</h1>

            <form method="POST" action="{{ url_for('commande.ajouter_commande') }}">
                <div>
                    <label for="quantite">Quantité:</label>
                    <input type="text" id="quantite" name="quantite" required>
                </div>
                <div>
                    <label for="prix_unitaire">Prix unitaire:</label>
                    <input type="text" id="prix_unitaire" name="prix_unitaire" required>
                </div>
                <div>
                    <label for="id_client">Id client:</label>
                    <input type="number" id="id_client" name="id_client" required>
                </div>

                <input type="submit" value="Enregistrer une commande">
            </form>
        </div>
    </main>
</body>
</html>
